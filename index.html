<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌻 Día de las Flores Amarillas - 21 de Septiembre</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Great+Vibes&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Pantalla de inicio -->
    <div id="pantalla-inicio">
        <div class="contenido-inicio">
            <div class="flores-decorativas-inicio">
                <span class="flor-deco">🌻</span>
                <span class="flor-deco"></span>
                <span class="flor-deco">🌸</span>
            </div>
            <h1 class="titulo-inicio">21 de Septiembre</h1>
            <p class="subtitulo-inicio">Día de las Flores Amarillas</p>
            <p class="descripcion-inicio">Un regalo especial para alguien muy especial</p>
            <button id="btn-iniciar" onclick="iniciarExperiencia()">
                 Abrir Regalo
            </button>
        </div>
    </div>

    <!-- Marco de flores en el borde -->
    <div id="marco-flores-borde">
        <div class="borde-flores borde-superior" id="borde-superior"></div>
        <div class="borde-flores borde-inferior" id="borde-inferior"></div>
        <div class="borde-flores borde-izquierdo" id="borde-izquierdo"></div>
        <div class="borde-flores borde-derecho" id="borde-derecho"></div>
    </div>

    <!-- Contenedor principal -->
    <div id="contenedor-principal">
        <canvas id="canvas-efectos"></canvas>

        <!-- Mariposas globales -->
        <div class="mariposa mariposa-1">🦋</div>
        <div class="mariposa mariposa-2">🦋</div>
        <div class="mariposa mariposa-3">🦋</div>
        <div class="mariposa mariposa-4"></div>

        <!-- Ramo de flores -->
        <div id="ramo-construccion">
            <div id="envoltorio-ramo" class="envoltorio-ramo"></div>
            <div id="flores-ramo" class="flores-ramo"></div>
            <div id="corona-ramo" class="corona-ramo">👑</div>
            <div id="mariposas-ramo">
                <span class="mariposa-ramo m1">🦋</span>
                <span class="mariposa-ramo m2">🦋</span>
                <span class="mariposa-ramo m3">🦋</span>
            </div>
        </div>

        <!-- Mensajes -->
        <div id="contenedor-mensajes">
            <div class="mensaje-display" id="mensaje-actual"></div>
        </div>

        <!-- Gran Final -->
        <div id="gran-final" class="gran-final">
            <div class="final-contenedor">
                <div class="final-imagenes">
                    <img src="assets/alex.jpeg" alt="Alex" class="imagen-alex">
                    <img src="assets/flores.png" alt="Ramo" class="imagen-ramo-final">
                </div>
                <div class="nombre-contenedor">
                    <div class="nombre-linea1">Con todo mi cariño,</div>
                    <div class="nombre-principal">Alex Parrales Choez</div>
                    <div class="nombre-linea2">💛 Feliz Día de las Flores Amarillas 💛</div>
                </div>
                <button class="btn-repetir" onclick="location.reload()"> Ver de Nuevo</button>
            </div>
        </div>

        <button id="btn-musica" class="btn-musica" onclick="toggleMusica()">🎵</button>
        <div id="tiempo-transcurrido" class="tiempo"></div>
    </div>

    <!-- Audio -->
    <audio id="musica-fondo" loop>
        <source src="assets/musica.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>
</html>
